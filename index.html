<style>

#side{position:fixed;right:14px;top:70px;bottom:210px;width:min(450px,94vw);overflow:auto;padding:18px 20px;z-index:20}

#plan{position:fixed;inset:0;z-index:30;background:rgba(10,8,5,.95);display:flex;flex-direction:column}

#plan canvas{flex:1;width:100%;min-height:0;cursor:crosshair}
#settings label{display:block;margin:12px 0 4px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
#settings input[type=range]{width:100%}#settings select{width:100%;background:#120d07;color:var(--txt);border:1px solid var(--line);padding:8px;border-radius:8px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:45;transition:opacity .45s}
#blessing{position:fixed;left:50%;top:22%;transform:translateX(-50%);text-align:center;z-index:15;pointer-events:none;text-shadow:0 2px 14px #000;width:90vw}
#blessing .q{font-family:'Frank Ruhl Libre',serif;direction:rtl;font-size:clamp(26px,4.4vw,48px);color:#fff4d0;line-height:1.5}#blessing .en{color:var(--dim);font-size:15px}
#touch{position:fixed;inset:0;pointer-events:none;z-index:11}
#joy{position:fixed;left:26px;bottom:26px;width:130px;height:130px;border-radius:50%;background:rgba(255,240,200,.08);border:1px solid var(--line);pointer-events:auto}
#joy i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(217,178,92,.55)}
#tbtns{position:fixed;right:20px;bottom:210px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
#tbtns .btn{width:62px;height:62px;border-radius:50%;padding:0;font-size:12px}
#help ul{padding-inline-start:18px;line-height:1.75;font-size:14px}
kbd{background:#2a2012;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-family:Inter,sans-serif}
@media (max-width:760px){#loc .he{font-size:19px}#minimap{width:120px;height:120px}#side{top:auto;bottom:0;right:0;left:0;width:auto;max-height:58vh;border-radius:16px 16px 0 0}#topbar{max-width:64vw}#prompt{bottom:180px;white-space:normal;max-width:90vw}#quest{top:80px;width:62vw}#creator{top:auto;height:62vh;left:8px;right:8px;width:auto;bottom:8px}#dragHint{left:50%;bottom:auto;top:16px}}
</style>

<body>

<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   BEIS HAMIKDASH — Second Temple walkthrough
   World units: 1 unit = 1 amah (cubit).  +X = east, -X = west, +Z = south.
   All primary dimensions follow Mishnah Middot (see PLACES + README).
   ===================================================================== */

const $ = (id) => document.getElementById(id);
const isTouch = matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
// graphics level: 'auto' picks by device; 'low' for slow computers; the user can change it in ⚙ (saved)
const GFX_PREF = (() => { if (/[?&]low/.test(location.search)) return 'low'; try { return localStorage.getItem('bhm-gfx') || 'auto'; } catch (e) { return 'auto'; } })();
const strongDevice = !isTouch && (navigator.hardwareConcurrency || 4) >= 6 && (navigator.deviceMemory || 8) >= 8;
const QUALITY = { pref: GFX_PREF, high: GFX_PREF === 'high' || (GFX_PREF === 'auto' && strongDevice) };
const AMAH_CM = { naeh: 48, chazonIsh: 57.6, avg: 52.5 };
let amahStd = 'naeh';

const loadStep = (pct, msg) => { $('loadbar').firstElementChild.style.width = pct + '%'; if (msg) $('loadmsg').textContent = msg; };
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));

/* ---------- seeded random ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry32(5785);
const rr = (a, b) => a + (b - a) * rnd();
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
const clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: QUALITY.high, powerPreference: 'high-performance' });
const BASE_DPR = Math.min(devicePixelRatio, QUALITY.high ? 1.5 : 1.0);
let resScale = 1;                                   // adaptive resolution (see frame loop)
renderer.setPixelRatio(BASE_DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.6;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd9d4c8, 400, 3200);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.15, 9000);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; pmrem.dispose();
scene.environmentIntensity = 0.55;

const sky = new Sky(); sky.scale.setScalar(30000); scene.add(sky);
const skyU = sky.material.uniforms;
skyU.turbidity.value = 5.5; skyU.rayleigh.value = 1.4; skyU.mieCoefficient.value = 0.004; skyU.mieDirectionalG.value = 0.82;

const sun = new THREE.DirectionalLight(0xfff0d8, 3.2);
sun.castShadow = true;
const SM = QUALITY.high ? 2048 : 1024;
sun.shadow.mapSize.set(SM, SM);
const SR = QUALITY.high ? 110 : 75;
Object.assign(sun.shadow.camera, { left: -SR, right: SR, top: SR, bottom: -SR, near: 10, far: 1200 });
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.5;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xdfe8f5, 0x9a8160, 0.9); scene.add(hemi);
const sunDir = new THREE.Vector3(1, 1, 0.3).normalize();
let timeOfDay = 9.0, isNight = false;
const nightLights = [];   // things that glow at night
/* ---------- light pool: a few real point lights follow the nearest light sources (cheap, no shader recompiles) ---------- */
const lightSources = [], lightPool = [];
function initLightPool(n) { for (let i = 0; i < n; i++) { const L = new THREE.PointLight(0xffffff, 0, 100, 1.6); scene.add(L); lightPool.push(L); } }
function addLightSource(color, intensity, dist, x, y, z, nightOnly = false, dayIntensity = 0) {
  const s = { pos: new THREE.Vector3(x, y, z), color: new THREE.Color(color), intensity, dist, nightOnly, dayIntensity, mult: 1 };
  lightSources.push(s); return s;
}

  h -= 30 * Math.exp(-Math.pow((z - 900) / 140, 2)) * smooth(-600, 200, x); // Gei Ben Hinnom (south)
  h += 25 * smooth(-200, -900, x);                                    // the Upper City rises to the west
  const d = Math.max(Math.abs(x), Math.abs(z));
  h = lerp(H.city, h, smooth(262, 330, d));
  // flatten the corridor of the Pilgrim Road down to the Shiloach pool
  const w = smooth(100, 70, Math.abs(x + 80)) * smooth(230, 280, z) * smooth(1060, 990, z);
  if (w > 0) { const t = z < 342 ? H.city : z < 905 ? streetY(z) : POOL_Y; h = lerp(h, t - 0.4, w); }
  return h;
}

function radialTex(stops, size = 128) {
  return canvasTex(size, size, (g, w, h) => {
    const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);

}

/* ---------- particles: fire + the straight pillar of smoke (Yoma 21a) ---------- */
function makeFire(x, y, z, { spread = 2.2, count = 160, height = 7, smoke = true, smokeCount = 220, smokeH = 140 } = {}) {
  const fireTex = radialTex([[0, 'rgba(255,255,220,1)'], [0.25, 'rgba(255,190,80,.9)'], [0.6, 'rgba(240,90,20,.35)'], [1, 'rgba(0,0,0,0)']]);
  const fg = new THREE.BufferGeometry(); const fp = new Float32Array(count * 3); const fl = [];
  for (let i = 0; i < count; i++) fl.push({ life: rnd(), sx: rr(-spread, spread), sz: rr(-spread, spread) });
  fg.setAttribute('position', new THREE.BufferAttribute(fp, 3));
  const fire = new THREE.Points(fg, new THREE.PointsMaterial({ map: fireTex, size: 2.6, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffb060 }));
  fire.position.set(x, y, z); fire.frustumCulled = false; scene.add(fire);
  let sm = null, sl = [], sp;
  if (smoke) {
    const smokeTex = radialTex([[0, 'rgba(200,195,190,.55)'], [0.5, 'rgba(170,165,160,.25)'], [1, 'rgba(150,150,150,0)']]);
    const sg = new THREE.BufferGeometry(); sp = new Float32Array(smokeCount * 3);
    for (let i = 0; i < smokeCount; i++) sl.push({ life: rnd() });
    sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
    sm = new THREE.Points(sg, new THREE.PointsMaterial({ map: smokeTex, size: 9, transparent: true, depthWrite: false, color: 0xd8d2c8, opacity: 0.55 }));
    sm.position.set(x, y + 2, z); sm.frustumCulled = false; scene.add(sm);
  }
  const state = { intensity: 1 };
  animated.push((dt) => {
    for (let i = 0; i < count; i++) {
      const p = fl[i]; p.life += dt * (0.9 + (i % 7) * 0.08);
      if (p.life > 1) { p.life -= 1; p.sx = rr(-spread, spread); p.sz = rr(-spread, spread); }
      const k = 1 - p.life;
      fp[i * 3] = p.sx * k + Math.sin(p.life * 9 + i) * 0.3; fp[i * 3 + 1] = p.life * height * state.intensity; fp[i * 3 + 2] = p.sz * k;
    }
    fg.attributes.position.needsUpdate = true;
    if (sm) {
      for (let i = 0; i < smokeCount; i++) {
        const p = sl[i]; p.life += dt * 0.05 * (0.8 + (i % 5) * 0.1); if (p.life > 1) p.life -= 1;
        const r = 1.5 + p.life * 3;
        sp[i * 3] = Math.sin(i * 12.9) * r; sp[i * 3 + 1] = p.life * smokeH; sp[i * 3 + 2] = Math.cos(i * 7.3) * r;
      }
      sm.geometry.attributes.position.needsUpdate = true;
      sm.material.size = 9 + 4 * state.intensity;
    }
  });
  return state;
}

const FLAMES = { day: [], night: [] };
function flameSprite(x, y, z, parent = scene, s = 0.5, nightOnly = false) { (nightOnly ? FLAMES.night : FLAMES.day).push([x, y, z, s]); }

/* ---------- column instancing ---------- */
const columnSpots = [];
function addColumn(x, z, y0, h, r = 1.5) { columnSpots.push({ x, z, y0, h, r }); colliders.push({ x0: x - r, x1: x + r, z0: z - r, z1: z + r, bottom: y0, top: y0 + h }); }
function buildColumns() {
  const n = columnSpots.length; if (!n) return;
  const shaft = new THREE.CylinderGeometry(1, 1.08, 1, 20); shaft.translate(0, 0.5, 0);
  const base = new THREE.CylinderGeometry(1.5, 1.6, 1, 20); base.translate(0, 0.5, 0);

  const abacus = new THREE.BoxGeometry(3.6, 0.6, 3.6); abacus.translate(0, 0.3, 0);
  const I = (g, mat) => { const m = new THREE.InstancedMesh(g, mat, n); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m; };
  const ms = I(shaft, MAT.marble), mb = I(base, MAT.white), mc = I(cap, MAT.goldDim), ma = I(abacus, MAT.white);
  const M = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  columnSpots.forEach((c, i) => {
    const r = c.r * 0.7;
    mb.setMatrixAt(i, M.compose(p.set(c.x, c.y0, c.z), q, s.set(r, 1, r)));
    ms.setMatrixAt(i, M.compose(p.set(c.x, c.y0 + 1, c.z), q, s.set(r, c.h - 2.6, r)));
    mc.setMatrixAt(i, M.compose(p.set(c.x, c.y0 + c.h - 1.6, c.z), q, s.set(r, 1.0, r)));
    ma.setMatrixAt(i, M.compose(p.set(c.x, c.y0 + c.h - 0.6, c.z), q, s.set(r, 1, r)));
  });
}

  welcome: { en: 'Welcome, {0}. You stand in the plaza below Har HaBayis among the pilgrims. Immerse in the mikveh, then climb the Southern Steps. Your journey is under 📜.', he: 'ברוך הבא, {0}. אתה עומד ברחבה שלמרגלות הר הבית בין עולי הרגל. טבול במקווה ועלה במעלות הדרום. המסע שלך תחת 📜.', yi: 'ברוך הבא, {0}. איר שטייט אויפן פלאץ אונטער הר הבית צווישן די עולי רגל. טובלט זיך אין מקוה, דערנאך גייט ארויף די דרום-טרעפ. אייער נסיעה איז אונטער 📜.', es: 'Bienvenido, {0}. Estás en la plaza bajo el Monte del Templo entre los peregrinos. Sumérgete en la mikvé y sube las Escaleras del Sur. Tu viaje está en 📜.' },
  blockKodesh: { en: 'Even a kohen does not enter here. Only the Kohen Gadol entered the Kodesh HaKodashim — once a year, on Yom Kippur, in white linen (Vayikra 16). Study mode in ⚙ lets you view it as a learning model.', he: 'גם כהן אינו נכנס לכאן. רק הכהן הגדול נכנס לקודש הקדשים — פעם בשנה, ביום הכיפורים, בבגדי לבן (ויקרא טז). במצב לימוד (⚙) אפשר לראותו כדגם.', yi: 'אפילו א כהן גייט נישט אהער אריין. נאר דער כהן גדול איז אריין אין קודש הקדשים — איינמאל א יאר, יום כיפור, אין ווייסע בגדים (ויקרא ט״ז). אין לערן-מצב (⚙) קען מען עס זען ווי א מאדעל.', es: 'Ni un cohén entra aquí. Solo el Sumo Sacerdote entraba al Santo de los Santos — una vez al año, en Yom Kipur, vestido de lino blanco (Levítico 16). El modo estudio (⚙) permite verlo como modelo.' },
  blockYisrael: { en: 'A Yisrael stands in Ezras Yisrael — beyond the Duchan is Ezras Kohanim (Keilim 1:8). Choose “Kohen”, or Study mode in ⚙, to walk further.', he: 'ישראל עומד בעזרת ישראל — מעבר לדוכן היא עזרת כהנים (כלים א, ח). בחר ״כהן״ או מצב לימוד (⚙) כדי להמשיך.', yi: 'א ישראל שטייט אין עזרת ישראל — הינטער דעם דוכן איז עזרת כהנים (כלים א׳ ח׳). קלייבט ״כהן״ אדער לערן-מצב (⚙) כדי ווייטער צו גיין.', es: 'Un israelita permanece en el atrio de Israel — tras el Dujan está el atrio de los cohanim (Keilim 1:8). Elige “Cohén” o el modo estudio (⚙) para avanzar.' },
  blockLevi: { en: 'Leviim stand on the Duchan; beyond it is Ezras Kohanim (Keilim 1:8). Choose “Kohen”, or Study mode in ⚙, to walk further.', he: 'הלויים עומדים על הדוכן; מעבר לו עזרת כהנים (כלים א, ח). בחר ״כהן״ או מצב לימוד (⚙).', yi: 'די לוים שטייען אויפן דוכן; הינטער אים איז עזרת כהנים (כלים א׳ ח׳). קלייבט ״כהן״ אדער לערן-מצב (⚙).', es: 'Los leviím están en el Dujan; detrás está el atrio de los cohanim (Keilim 1:8). Elige “Cohén” o el modo estudio (⚙).' },
  blockCity: { en: 'You can walk the Pilgrim Road down to the Shiloach pool. The rest of the city is seen from afar.', he: 'אפשר ללכת בדרך העולים עד בריכת השילוח. שאר העיר נראית מרחוק.', yi: 'מען קען גיין אויפן וועג פון די עולים ביז דער בריכת השילוח. די איבעריגע שטאט זעט מען פון ווייטנס.', es: 'Puedes recorrer el Camino de los Peregrinos hasta el estanque de Siloé. El resto de la ciudad se ve de lejos.' },
  coinMsg: { en: 'Your coin rings into the chest marked <span class="he">{0}</span> — {1} (Shekalim 6:5).', he: 'המטבע מצלצל אל השופר שעליו כתוב <span class="he">{0}</span> (שקלים ו, ה).', yi: 'דער מטבע קלינגט אריין אין שופר וואס עס שטייט אויף אים <span class="he">{0}</span> (שקלים ו׳ ה׳).', es: 'Tu moneda suena en el cofre marcado <span class="he">{0}</span> — {1} (Shekalim 6:5).' },
  washMsg: { en: 'Kiddush yadayim v’raglayim: right hand on right foot, left hand on left foot, under the water of the Kiyor (Zevachim 19b).', he: 'קידוש ידיים ורגליים: יד ימין על רגל ימין ויד שמאל על רגל שמאל, תחת מי הכיור (זבחים יט ע״ב).', yi: 'קידוש ידיים ורגליים: די רעכטע האנט אויפן רעכטן פוס, די לינקע האנט אויפן לינקן פוס, אונטער די וואסער פונעם כיור (זבחים י״ט ע״ב).', es: 'Santificación de manos y pies: mano derecha sobre pie derecho, izquierda sobre izquierdo, bajo el agua del Kiyor (Zevajim 19b).' },
  washNo: { en: 'Only kohanim sanctify hands and feet at the Kiyor before the avodah.', he: 'רק כהנים מקדשים ידיים ורגליים מן הכיור לפני העבודה.', yi: 'נאר כהנים וואשן הענט און פיס פונעם כיור פאר דער עבודה.', es: 'Solo los cohanim se lavan en el Kiyor antes del servicio.' },
  mikvehMsg: { en: 'Tevilah: the olei regel immersed before going up — many mikvaos were found beside the Southern Steps and along the Pilgrim Road.', he: 'טבילה: עולי הרגל טבלו לפני העלייה — מקוואות רבים נמצאו ליד מעלות הדרום ולאורך דרך העולים.', yi: 'טבילה: די עולי רגל האבן זיך געטובלט פארן ארויפגיין — מען האט געפונען אסאך מקוואות לעבן די דרום-טרעפ און לענגאויס דעם וועג פון די עולים.', es: 'Inmersión: los peregrinos se sumergían antes de subir — se hallaron muchas mikvaot junto a las Escaleras del Sur y en el Camino de los Peregrinos.' },
  avodahMsg: { en: '<b>Tamid shel Shachar.</b> The limbs go up the Kevesh; at the wine libation the silver trumpets sound, the Leviim sing, and the people bow (Tamid 7:3).', he: '<b>תמיד של שחר.</b> האיברים עולים בכבש; בניסוך היין תוקעים בחצוצרות, הלויים אומרים שירה והעם משתחווה (תמיד ז, ג).', yi: '<b>תמיד של שחר.</b> די אברים גייען ארויף דעם כבש; ביים נסוך היין בלאזט מען מיט די חצוצרות, די לוים זינגען און דער עולם בוקט זיך (תמיד ז׳ ג׳).', es: '<b>Ofrenda diaria de la mañana.</b> Los miembros suben por la rampa; en la libación de vino suenan las trompetas de plata, cantan los leviím y el pueblo se postra (Tamid 7:3).' },
  birkasLead: { en: 'Birkas Kohanim on the steps of the Ulam — ', he: 'ברכת כהנים על מעלות האולם — ', yi: 'ברכת כהנים אויף די טרעפ פונעם אולם — ', es: 'Bendición sacerdotal en las escaleras del Ulam — ' },

  viewTP: { en: 'Third-person view — you can see yourself', he: 'מבט מגוף שלישי — אתה רואה את עצמך', yi: 'בליק פון הינטן — איר זעט זיך אליין', es: 'Vista en tercera persona — puedes verte' },

  measNote: { en: 'All in amos, from Mishnah Middos unless noted. Metres: amah of 48 cm (R’ Chaim Na’eh) – 57.6 cm (Chazon Ish).', he: 'הכל באמות, ממשנת מידות אלא אם צוין. מטרים: אמה של 48 ס״מ (ר׳ חיים נאה) עד 57.6 ס״מ (חזון איש).', yi: 'אלעס אין אמות, פון משניות מדות סיידן עס שטייט אנדערש. מעטער: אן אמה פון 48 ס״מ (ר׳ חיים נאה) ביז 57.6 ס״מ (חזון איש).', es: 'Todo en codos, de la Mishná Midot salvo indicación. Metros: codo de 48 cm (R. Jaim Naé) a 57,6 cm (Jazón Ish).' },
  measFloors: { en: 'Floor heights above Har HaBayis: Ezras Nashim +6 (12 steps of ½), Ezras Yisrael +13½ (15 more), Ezras Kohanim +16 (Duchan 2½), Ulam & Heichal +22 (12 steps).', he: 'גובה הרצפות מעל הר הבית: עזרת נשים +6 (12 מעלות של חצי אמה), עזרת ישראל +13½ (עוד 15), עזרת כהנים +16 (דוכן 2½), אולם והיכל +22 (12 מעלות).', yi: 'הייך פון די פלארן איבערן הר הבית: עזרת נשים +6 (12 טרעפ פון א האלבע אמה), עזרת ישראל +13½ (נאך 15), עזרת כהנים +16 (דוכן 2½), אולם און היכל +22 (12 טרעפ).', es: 'Alturas sobre el Monte: Ezrat Nashim +6 (12 escalones de ½), atrio de Israel +13½ (15 más), atrio de cohanim +16 (Dujan 2½), Ulam y Heijal +22 (12 escalones).' },

  helpNote: { en: 'Built to the measurements of Mishnah Middos. Where Rishonim and Acharonim differ (Rambam, Tosfos Yom Tov’s Tzuras HaBayis, Tiferes Yisrael, the Vilna Gaon), the model follows the plain reading of the Mishnah with the Bartenura. Details the Mishnah does not give — the stoas, the city, colours of ordinary clothing — follow Josephus, the excavations and the Avi-Yonah model.', he: 'נבנה לפי מידות משנת מידות. במקום שנחלקו ראשונים ואחרונים (רמב״ם, צורת הבית לתוספות יום טוב, תפארת ישראל, הגר״א) הולך הדגם כפשט המשנה עם הברטנורא. פרטים שאינם במשנה — הסטווים, העיר, צבעי הבגדים הרגילים — לפי יוסף בן מתתיהו, החפירות ודגם אבי-יונה.', yi: 'געבויט לויט די מאסן פון משניות מדות. וואו ראשונים און אחרונים טענה\'ן זיך (רמב״ם, צורת הבית פונעם תוספות יום טוב, תפארת ישראל, דער גר״א) גייט דער מאדעל לויטן פשט פון דער משנה מיטן ברטנורא. זאכן וואס די משנה זאגט נישט — די סטווים, די שטאט, קאלירן פון געווענליכע קליידער — לויט יוסף בן מתתיהו, די אויסגראבונגען און דעם אבי-יונה מאדעל.', es: 'Construido según las medidas de la Mishná Midot. Donde los comentaristas difieren (Rambam, Tzurat HaBait del Tosfot Yom Tov, Tiferet Israel, el Gaón de Vilna), el modelo sigue el sentido llano de la Mishná con Bartenura. Lo que la Mishná no detalla — los pórticos, la ciudad, los colores de la ropa — sigue a Josefo, las excavaciones y el modelo Avi-Yonah.' },
  helpTamei: { en: 'Today everyone is tamei meis and may not go up onto Har HaBayis. This is a model for learning — “its study is as great as its building” (Tanchuma, Tzav 14).', he: 'היום כולנו טמאי מתים ואסורים לעלות להר הבית. זהו דגם ללימוד — ״גדולה קריאתה כבנינה״ (תנחומא צו יד).', yi: 'היינט זענען מיר אלע טמאי מתים און טארן נישט ארויפגיין אויפן הר הבית. דאס איז א מאדעל צו לערנען — ״גדולה קריאתה כבנינה״ (תנחומא צו י״ד).', es: 'Hoy todos estamos impuros por contacto con muertos y no podemos subir al Monte del Templo. Es un modelo para estudiar — “su estudio es tan grande como su construcción” (Tanjumá, Tzav 14).' },

  P('kodesh', LAY.kodesh, { L: 20, W: 20, H: 40 }, 'Middot 4:7 · Yoma 5:2 · Rambam, Beis HaBechirah 4:1', [-109, 6],
    { en: 'Kodesh HaKodashim — the Holy of Holies', he: 'קודש הקדשים', yi: 'קודש הקדשים', es: 'El Santo de los Santos' },
    { en: 'Twenty by twenty amos. In the Second Temple it stood empty — the Aron had been hidden in the days of Yoshiyahu. Only the Even HaShesiyah, the Foundation Stone, rose three fingers above the floor, and on Yom Kippur the Kohen Gadol placed the incense pan upon it.', he: 'עשרים על עשרים אמה. בבית שני עמד ריק — הארון נגנז בימי יאשיהו. רק אבן השתייה הייתה גבוהה מן הארץ שלוש אצבעות, ועליה הניח הכהן הגדול את המחתה ביום הכיפורים.', yi: 'צוואנציג אויף צוואנציג אמות. אינעם בית שני איז עס געשטאנען ליידיג — דער ארון איז באהאלטן געווארן אין די טעג פון יאשיהו. נאר דער אבן השתיה איז ארויסגעשטאנען דריי פינגער פון דער ערד, און יום כיפור האט דער כהן גדול אויף איר אוועקגעשטעלט די מחתה.', es: 'Veinte por veinte codos. En el Segundo Templo estaba vacío — el Arca fue escondida en tiempos de Yoshiyahu. Solo la Piedra Fundamental sobresalía tres dedos del suelo, y en Yom Kipur el Sumo Sacerdote colocaba sobre ella el incensario.' }),
  P('traksin', LAY.traksin, { L: 1, W: 20, H: 40 }, 'Middot 4:7 · Yoma 5:1, 51b · Shekalim 8:5', [-96, 0],
    { en: 'Amah Traksin & the two Paroches', he: 'אמה טרקסין ושתי הפרוכות', yi: 'אמה טרקסין און די צוויי פרוכות', es: 'El codo Traksín y los dos velos' },
    { en: 'In the First Temple a wall one amah thick stood here. In the Second Temple the builders were unsure whether that amah belonged to the Heichal or the Kodesh HaKodashim, so two curtains hung an amah apart; the outer was folded back at the south, the inner at the north, and the Kohen Gadol walked between them.', he: 'בבית ראשון עמד כאן כותל עובי אמה. בבית שני נסתפקו אם האמה שייכת להיכל או לקודש הקדשים, ולכן תלו שתי פרוכות ואמה ביניהן; החיצונה פרופה מן הדרום, הפנימית מן הצפון, והכהן הגדול מהלך ביניהן.', yi: 'אינעם בית ראשון איז דא געשטאנען א וואנט אן אמה דיק. אינעם בית שני האט מען זיך מסופק געווען צי די אמה געהערט צום היכל אדער צום קודש הקדשים, האט מען אויפגעהאנגען צוויי פרוכות מיט אן אמה צווישן זיי; די אויסערליכע איז אפגעבויגן פון דרום, די אינעווייניגסטע פון צפון, און דער כהן גדול גייט צווישן זיי.', es: 'En el Primer Templo había aquí un muro de un codo. En el Segundo dudaron si ese codo pertenecía al Heijal o al Santo de los Santos, y colgaron dos velos separados un codo; el exterior abierto al sur, el interior al norte, y el Sumo Sacerdote caminaba entre ellos.' }),
  P('heichal', LAY.heichal, { L: 40, W: 20, H: 40 }, 'Middot 4:7 · Menachos 98b–99a · Rambam, Beis HaBechirah 3:12', [-63, 0],
    { en: 'The Heichal — the Sanctuary', he: 'ההיכל', yi: 'דער היכל', es: 'El Heijal — el Santuario' },
    { en: 'Forty amos long, twenty wide, forty high, overlaid with gold. The Shulchan stands in the north with twelve loaves of Lechem HaPanim; the Menorah in the south; the golden Mizbach HaKetores between them.', he: 'ארבעים אמה אורכו, עשרים רוחבו וארבעים גובהו, מצופה זהב. השלחן בצפון ועליו שתים עשרה חלות לחם הפנים; המנורה בדרום; ומזבח הזהב ביניהם.', yi: 'פערציג אמות לאנג, צוואנציג ברייט, פערציג הויך, באצויגן מיט גאלד. דער שלחן שטייט אין צפון מיט צוועלף לחם הפנים; די מנורה אין דרום; און דער גאלדענער מזבח הקטורת צווישן זיי.', es: 'Cuarenta codos de largo, veinte de ancho y cuarenta de alto, recubierto de oro. La Mesa al norte con doce panes de la proposición; la Menorá al sur; el altar de oro del incienso entre ambos.' }),
  P('heichalDoor', LAY.heichalDoor, { W: 10, H: 20 }, 'Middot 4:1-2 · Yoma 37a', [-55, 0],
    { en: 'Entrance of the Heichal', he: 'פתח ההיכל', yi: 'דער פתח פונעם היכל', es: 'Entrada del Heijal' },
    { en: 'Twenty amos high and ten wide, with four doors that folded back against the walls. Above it hung the Golden Vine and Queen Helena’s golden nivreshes, which flashed in the morning sun.', he: 'גובהו עשרים אמה ורחבו עשר, וארבע דלתות שנקפלות אל הכתלים. מעליו הגפן של זהב והנברשת של הילני המלכה, שהבהיקה בשמש הבוקר.', yi: 'צוואנציג אמות הויך און צען ברייט, מיט פיר טירן וואס לייגן זיך צו צו די ווענט. איבער אים הענגט דער גאלדענער ווייַנשטאק און הילני המלכה׳ס גאלדענע נברשת, וואס האט געבליצט אין דער פרימארגן-זון.', es: 'Veinte codos de alto y diez de ancho, con cuatro puertas que se plegaban contra los muros. Encima, la vid de oro y el candelabro dorado de la reina Helena, que brillaba al sol de la mañana.' }),
  P('ulam', LAY.ulamFloor, { L: 11, W: 90, H: 90 }, 'Middot 3:7-8, 4:7 · Menachos 99b', [-46, 0],
    { en: 'The Ulam — Entrance Hall', he: 'האולם', yi: 'דער אולם', es: 'El Ulam — vestíbulo' },
    { en: 'Eleven amos deep, reaching fifteen amos past the Heichal on each side (100 wide outside). Its entrance had no doors. Inside: two tables, of marble and of gold, for the Lechem HaPanim; above the Heichal door, the Golden Vine to which people donated leaves and grapes.', he: 'עומקו אחת עשרה אמה, והוא עודף על ההיכל חמש עשרה אמה לכל צד (מאה אמה רוחבו מבחוץ). לפתחו לא היו דלתות. בתוכו שני שולחנות, של שיש ושל זהב, ללחם הפנים; ומעל פתח ההיכל הגפן של זהב שהתנדבו לה עלים ואשכולות.', yi: 'עלף אמות טיף, און ער גייט ארויס פופצן אמות פון יעדער זייט פונעם היכל (הונדערט ברייט פון דרויסן). זיין אריינגאנג האט נישט געהאט קיין טירן. אינעווייניג: צוויי טישן, פון מירמל און פון גאלד, פאר׳ן לחם הפנים; איבערן היכל-טיר, דער גאלדענער ווייַנשטאק וואס מען האט נודב געווען בלעטער און טרויבן.', es: 'Once codos de fondo, sobresaliendo quince codos a cada lado del Heijal (100 de ancho por fuera). Su entrada no tenía puertas. Dentro: dos mesas, de mármol y de oro, para el pan de la proposición; sobre la puerta del Heijal, la vid de oro a la que la gente donaba hojas y racimos.' }),
  P('ulamDoor', LAY.ulamDoor, { W: 20, H: 40 }, 'Middot 3:7', [-38, 0],
    { en: 'Entrance of the Ulam', he: 'פתח האולם', yi: 'דער פתח פונעם אולם', es: 'Entrada del Ulam' },
    { en: 'Forty amos high and twenty wide, with five beams of oak (maltera’os) above it, each projecting an amah beyond the one beneath, with rows of stone between them.', he: 'גובהו ארבעים אמה ורחבו עשרים, ומעליו חמש מלתראות של מילת, כל אחת עודפת אמה על חברתה, ונדבכי אבנים ביניהן.', yi: 'פערציג אמות הויך און צוואנציג ברייט, מיט פינף מלתראות פון אייכנהאלץ איבער אים, יעדע ארויסגעשטעלט אן אמה איבער דער אונטערשטער, מיט רייען שטיינער צווישן זיי.', es: 'Cuarenta codos de alto y veinte de ancho, con cinco vigas de roble encima, cada una sobresaliendo un codo de la inferior, con hiladas de piedra entre ellas.' }),
  P('ulamSteps', LAY.ulamSteps, { L: 12, W: 50, H: 6 }, 'Middot 3:6 · Tamid 7:2', [-23, 0],
    { en: 'The twelve steps to the Ulam', he: 'שתים עשרה מעלות האולם', yi: 'די צוועלף טרעפ צום אולם', es: 'Los doce escalones del Ulam' },
    { en: 'Twelve steps, each half an amah, rising six amos from the Azarah to the Ulam. Here the kohanim stood for Birkas Kohanim after the Tamid.', he: 'שתים עשרה מעלות, כל אחת חצי אמה, העולות שש אמות מן העזרה לאולם. עליהן עמדו הכהנים לברכת כהנים אחרי התמיד.', yi: 'צוועלף טרעפ, יעדע א האלבע אמה, וואס גייען ארויף זעקס אמות פון דער עזרה צום אולם. דא זענען די כהנים געשטאנען ביי ברכת כהנים נאכן תמיד.', es: 'Doce escalones de medio codo, que suben seis codos del atrio al Ulam. Aquí estaban los cohanim para la bendición sacerdotal tras el Tamid.' }),
  P('altarTop', LAY.altarTop, { L: 28, W: 28, H: 9 }, 'Middot 3:1 · Yoma 45a · Zevachim 62a', [12, 4],
    { en: 'Top of the Mizbeach (the Ma’arachah)', he: 'ראש המזבח (המערכה)', yi: 'אויבן אויפן מזבח (די מערכה)', es: 'La cima del altar' },
    { en: 'Twenty-eight by twenty-eight, with a horn at each corner and a walkway of one amah for the kohanim — leaving 24 × 24 for the fires. Three wood-piles burned here: the great pile, the pile for the coals of the Ketores, and the pile to keep the fire alive (Yoma 45a).', he: 'עשרים ושמונה על עשרים ושמונה, וקרן בכל פינה ואמה לילוך רגלי הכהנים — נשארו עשרים וארבע על עשרים וארבע למערכה. שלוש מערכות היו כאן: מערכה גדולה, מערכה שנייה לקטורת ומערכה לקיום האש (יומא מה ע״א).', yi: 'אכט און צוואנציג אויף אכט און צוואנציג, מיט א קרן אין יעדן ווינקל און אן אמה פאר די כהנים צו גיין — עס בלייבט פיר און צוואנציג אויף פיר און צוואנציג פאר׳ן פייער. דריי מערכות האבן דא געברענט: די גרויסע, די פאר׳ן קטורת, און די פאר קיום האש (יומא מ״ה ע״א).', es: 'Veintiocho por veintiocho, con un cuerno en cada esquina y un pasillo de un codo para los cohanim — quedan 24 × 24 para el fuego. Ardían tres hogueras: la grande, la del incienso y la del fuego perpetuo (Yoma 45a).' }),
  P('kevesh', LAY.ramp, { L: 32, W: 16 }, 'Middot 3:3 · Zevachim 62b', [2, 40],
    { en: 'The Kevesh — ramp', he: 'הכבש', yi: 'דער כבש', es: 'La rampa' },
    { en: 'On the south side of the Mizbeach, 32 long and 16 wide, separated from the altar by a hair’s breadth. No steps were permitted on the way up to the altar (Shemos 20:23), so it is a smooth slope.', he: 'בדרום המזבח, אורכו שלושים ושתיים ורחבו שש עשרה, ומובדל מן המזבח כחוט השערה. אין עולים במעלות על המזבח (שמות כ, כג), ולכן הוא משופע.', yi: 'אויף דער דרום-זייט פונעם מזבח, צוויי און דרייסיג לאנג און זעכצן ברייט, אפגעטיילט פונעם מזבח א האר-ברייט. מען טאר נישט גיין מיט טרעפ צום מזבח (שמות כ׳ כ״ג), דערפאר איז עס א גלאטער שיפוע.', es: 'Al sur del altar, 32 de largo y 16 de ancho, separada del altar por un pelo. No se sube al altar por escalones (Éxodo 20:23), así que es una pendiente lisa.' }),
  P('mizbeach', LAY.altar, { L: 32, W: 32, H: 10 }, 'Middot 3:1-4 · Zevachim 53a-54a', [-16, -4],
    { en: 'The Mizbeach HaChitzon — outer altar', he: 'המזבח החיצון', yi: 'דער מזבח החיצון', es: 'El altar exterior' },
    { en: 'Built of whole, unhewn stones from the valley of Beis Kerem, plastered twice a year. Base 32 × 32, up five amos to the sovev (30 × 30), up three more to the top (28 × 28). A red line around its middle divided the upper and lower bloods.', he: 'בנוי אבנים שלמות מבקעת בית כרם, ומסוידות פעמיים בשנה. היסוד שלושים ושתיים על שלושים ושתיים, עלה חמש אמות לסובב (שלושים על שלושים) ושלוש אמות לראשו (עשרים ושמונה). חוט הסיקרא חוגרו באמצעו להבדיל בין דמים העליונים לתחתונים.', yi: 'געבויט פון גאנצע אומגעהאקטע שטיינער פון בקעת בית כרם, באווייסט צוויי מאל א יאר. דער יסוד צוויי און דרייסיג אויף צוויי און דרייסיג, ארויף פינף אמות צום סובב (דרייסיג אויף דרייסיג), נאך דריי ביז אויבן (אכט און צוואנציג). א רויטער חוט הסיקרא ארום אין מיטן טיילט צווישן די אויבערשטע און אונטערשטע דמים.', es: 'Construido con piedras enteras sin labrar del valle de Bet Kérem, encalado dos veces al año. Base de 32 × 32, cinco codos más al sovev (30 × 30), tres más a la cima (28 × 28). Una línea roja en su mitad separaba las sangres de arriba y de abajo.' }),
  P('kiyor', [-23, -15, 11, 19], {}, 'Shemos 30:18 · Yoma 3:10, 37a · Middot 3:6', [-16, 9],
    { en: 'The Kiyor — laver', he: 'הכיור', yi: 'דער כיור', es: 'El Kiyor — la fuente' },
    { en: 'Between the Ulam and the Mizbeach, a little to the south. Ben Katin made twelve spigots so twelve kohanim could sanctify hands and feet at once, and the Mukheni wheel to lower it into water overnight.', he: 'בין האולם ולמזבח, נוטה לדרום. בן קטין עשה לו שנים עשר דדים כדי שיקדשו שנים עשר כהנים בבת אחת, ועשה מוכני לשקעו במים בלילה.', yi: 'צווישן דעם אולם און דעם מזבח, א ביסל צו דרום. בן קטין האט געמאכט צוועלף ברעזלעך כדי צוועלף כהנים זאלן זיך קענען וואשן אויף איינמאל, און דעם מוכני-ראד אים איינצוזינקען אין וואסער ביינאכט.', es: 'Entre el Ulam y el altar, algo al sur. Ben Katín le hizo doce grifos para que doce cohanim se lavaran a la vez, y la rueda Mujaní para sumergirla en agua de noche.' }),
  P('bein', [-24, -14, -67.5, 67.5], { L: 22 }, 'Middot 5:1 · Yoel 2:17 · Keilim 1:9', [-20, 0],
    { en: 'Between the Ulam and the Mizbeach', he: 'בין האולם ולמזבח', yi: 'בין האולם ולמזבח', es: 'Entre el Ulam y el altar' },
    { en: 'Twenty-two amos, including the steps of the Ulam. “Between the Ulam and the Mizbeach let the kohanim weep” — here the holiness was greater still: kohanim with blemishes or unwashed hands did not enter.', he: 'עשרים ושתיים אמה, כולל מעלות האולם. ״בין האולם ולמזבח יבכו הכהנים״ — מקודש יותר: אין בעלי מומין ופרועי ראש נכנסין לשם.', yi: 'צוויי און צוואנציג אמות, מיט די טרעפ פונעם אולם. ״בין האולם ולמזבח יבכו הכהנים״ — דא איז די קדושה נאך העכער: כהנים בעלי מומין אדער פרועי ראש גייען נישט אריין.', es: 'Veintidós codos, incluidos los escalones del Ulam. “Entre el vestíbulo y el altar lloren los sacerdotes” — aquí la santidad era aún mayor: no entraban cohanim con defectos.' }),
  P('mitbachayim', [-14, 18, -67.5, -20], { L: 32, W: 47.5 }, 'Middot 3:5, 5:2 · Tamid 3:5', [2, -40],
    { en: 'Beis HaMitbachayim — place of slaughter', he: 'בית המטבחיים', yi: 'בית המטבחיים', es: 'El lugar del sacrificio' },
    { en: 'North of the altar (kodshei kodashim were slaughtered in the north): 24 rings in the floor to hold the animals, then 8 marble tables for washing, then 8 short pillars with cedar beams and iron hooks for hanging and flaying.', he: 'צפונית למזבח (קדשי קדשים שחיטתן בצפון): עשרים וארבע טבעות ברצפה לאחוז את הבהמות, שמונה שולחנות של שיש להדחה, ושמונה ננסין עם קורות ארז ואונקליות של ברזל לתלות ולהפשיט.', yi: 'צפון פונעם מזבח (קדשי קדשים שעכט מען אין צפון): פיר און צוואנציג רינגען אין דער ערד צו האלטן די בהמות, אכט מירמל טישן צו וואשן, און אכט נידעריגע זיילן מיט צעדער באלקנס און אייזערנע העקלעך צו הענגען און אפשינדן.', es: 'Al norte del altar (las ofrendas santísimas se degollaban al norte): 24 anillas en el suelo para sujetar a los animales, 8 mesas de mármol para lavar y 8 pilares bajos con vigas de cedro y ganchos de hierro.' }),
  P('gazit', [8, 26, 58, 67.5], {}, 'Middot 5:4 · Sanhedrin 11:2', [17, 56],
    { en: 'Lishkas HaGazis — the Sanhedrin', he: 'לשכת הגזית', yi: 'לשכת הגזית', es: 'La Cámara de Piedra Tallada' },
    { en: 'Seat of the Great Sanhedrin of 71. Half of it stood in the holy Azarah and half outside, so the judges could sit in the unsanctified half. Here kohanim were examined for lineage and blemishes; those found fit wore white.', he: 'מושב הסנהדרין הגדולה של שבעים ואחד. חציה בקודש וחציה בחול, כדי שיוכלו הדיינים לשבת בחול. שם דנו את הכהונה; כהן שנמצא כשר לובש לבנים.', yi: 'דער זיץ פונעם סנהדרין גדולה פון איין און זיבעציג. האלב אין קודש און האלב אין חול, כדי די דיינים זאלן קענען זיצן אין חול. דארט האט מען געמשפט די כהונה; א כהן וואס איז געפונען געווארן כשר האט אנגעטון ווייס.', es: 'Sede del Gran Sanedrín de 71. Mitad en el atrio sagrado y mitad fuera, para que los jueces se sentaran en la parte no sagrada. Allí se examinaba a los cohanim; el hallado apto vestía de blanco.' }),
  P('moked', [-118, -82, -67.5, -54], {}, 'Middot 1:6-8 · Tamid 1:1', [-100, -50],
    { en: 'Beis HaMoked', he: 'בית המוקד', yi: 'בית המוקד', es: 'Bet HaMoked' },
    { en: 'A domed hall with a fire always burning, where the kohanim of the watch slept — the elders on stone ledges, the young ones on the floor. The keys of the Azarah were kept here under a marble slab.', he: 'בית מקורה כיפה ובו מדורה תמיד, ושם לנו כהני המשמר — הזקנים על רובדים של אבן והפרחים על הארץ. מפתחות העזרה נשמרו שם תחת טבלא של שיש.', yi: 'א הויז מיט א קופל און א פייער וואס ברענט שטענדיג, וואו די כהני המשמר האבן געשלאפן — די עלטערע אויף שטיינערנע בענק, די יונגע אויף דער ערד. די שליסלען פון דער עזרה האט מען דארט געהאלטן אונטער א מירמל-טאוול.', es: 'Sala abovedada con un fuego siempre encendido, donde dormían los cohanim de guardia — los ancianos en bancos de piedra, los jóvenes en el suelo. Las llaves del atrio se guardaban bajo una losa de mármol.' }),
  P('duchan', [27, 29, -67.5, 67.5], { L: 2, W: 135, H: 2.5 }, 'Middot 2:6 · Arachin 2:6 · Tamid 7:3', [30.5, 6],
    { en: 'The Duchan — platform of the Leviim', he: 'הדוכן', yi: 'דער דוכן', es: 'El Dujan — estrado de los leviím' },
    { en: 'Between Ezras Yisrael and Ezras Kohanim: a step one amah high with three steps of half an amah on it — Ezras Kohanim is 2½ amos higher than Ezras Yisrael. Here at least twelve Leviim stood and sang the Shir shel Yom.', he: 'בין עזרת ישראל לעזרת כהנים: מעלה גבוהה אמה ועליה שלוש מעלות של חצי אמה — עזרת כהנים גבוהה מעזרת ישראל שתי אמות ומחצה. כאן עמדו לפחות שנים עשר לויים ואמרו שיר של יום.', yi: 'צווישן עזרת ישראל און עזרת כהנים: א טרעפ אן אמה הויך מיט דריי טרעפ פון א האלבע אמה אויף אים — עזרת כהנים איז צוויי און א האלב אמות העכער פון עזרת ישראל. דא זענען געשטאנען צום ווייניגסטנס צוועלף לוים און געזינגען שיר של יום.', es: 'Entre el atrio de Israel y el de los cohanim: un escalón de un codo con tres de medio codo encima — el atrio de los cohanim está 2½ codos más alto. Aquí al menos doce leviím cantaban el salmo del día.' }),
  P('kohanim', [18, 27, -67.5, 67.5], { L: 11, W: 135 }, 'Middot 2:6, 5:1 · Keilim 1:8', [22, 30],
    { en: 'Ezras Kohanim', he: 'עזרת כהנים', yi: 'עזרת כהנים', es: 'Atrio de los cohanim' },
    { en: 'Eleven by 135 amos, from the Duchan to the Mizbeach. Yisraelim entered only for semichah, shechitah and tenufah of their korbanos.', he: 'אחת עשרה על מאה שלושים וחמש, מן הדוכן עד המזבח. ישראל נכנסים לשם רק לצורך סמיכה, שחיטה ותנופה.', yi: 'עלף אויף הונדערט פינף און דרייסיג אמות, פונעם דוכן ביזן מזבח. ישראלים גייען אריין נאר פאר סמיכה, שחיטה און תנופה.', es: 'Once por 135 codos, del Dujan al altar. Los israelitas entraban solo para la imposición de manos, el degüello y el balanceo de sus ofrendas.' }),
  P('yisrael', [29, 40, -67.5, 67.5], { L: 11, W: 135 }, 'Middot 2:6, 5:1', [35, 12],
    { en: 'Ezras Yisrael', he: 'עזרת ישראל', yi: 'עזרת ישראל', es: 'Atrio de Israel' },
    { en: 'Eleven by 135 amos — the place of the Yisraelim inside the Azarah, facing the Mizbeach and the Heichal. Under it were chambers, opening into Ezras Nashim, where the Leviim kept their instruments.', he: 'אחת עשרה על מאה שלושים וחמש — מקומם של ישראל בעזרה, מול המזבח וההיכל. תחתיה לשכות הפתוחות לעזרת נשים, ששם הניחו הלויים את כלי השיר.', yi: 'עלף אויף הונדערט פינף און דרייסיג אמות — דאס ארט פון די ישראלים אין דער עזרה, אנטקעגן דעם מזבח און דעם היכל. אונטער איר זענען געווען לשכות, אפן צו עזרת נשים, וואו די לוים האבן געהאלטן די כלי שיר.', es: 'Once por 135 codos — el lugar de los israelitas dentro del atrio, frente al altar y el Heijal. Debajo había cámaras, abiertas al atrio de las mujeres, donde los leviím guardaban sus instrumentos.' }),
  P('azarah', LAY.azarah, { L: 187, W: 135 }, 'Middot 5:1-2', [-30, 40],
    { en: 'The Azarah — inner court', he: 'העזרה', yi: 'די עזרה', es: 'El atrio interior' },
    { en: '187 amos east–west by 135 north–south. East to west: Ezras Yisrael 11, Ezras Kohanim 11, Mizbeach 32, to the Ulam 22, the Heichal building 100, behind the Kapores 11. Seven gates — three north, three south, and Nikanor in the east.', he: 'מאה שמונים ושבע ממזרח למערב על מאה שלושים וחמש. ממזרח למערב: עזרת ישראל 11, עזרת כהנים 11, המזבח 32, בין האולם ולמזבח 22, ההיכל 100, ואחורי הכפורת 11. שבעה שערים — שלושה בצפון, שלושה בדרום, וניקנור במזרח.', yi: 'הונדערט זיבן און אכציג אמות פון מזרח ביז מערב, הונדערט פינף און דרייסיג פון צפון ביז דרום. פון מזרח: עזרת ישראל 11, עזרת כהנים 11, מזבח 32, ביזן אולם 22, דער היכל 100, הינטער דער כפורת 11. זיבן טויערן — דריי אין צפון, דריי אין דרום, און ניקנור אין מזרח.', es: '187 codos de este a oeste por 135. De este a oeste: atrio de Israel 11, de los cohanim 11, altar 32, hasta el Ulam 22, el edificio del Heijal 100, detrás del Kaporet 11. Siete puertas — tres al norte, tres al sur y Nicanor al este.' }),
  P('nikanor', [40, 44, -5, 5], { W: 10, H: 20 }, 'Middot 1:4, 2:3, 2:6 · Yoma 38a', [46, 0],
    { en: 'Sha’ar Nikanor', he: 'שער ניקנור', yi: 'שער ניקנור', es: 'La puerta de Nicanor' },
    { en: 'The eastern gate of the Azarah, twenty high and ten wide, with two wickets. Its doors were of Corinthian bronze that shone like gold; when Nikanor brought them by sea from Alexandria the sea was calmed for them, so they were never replaced with gold.', he: 'שער העזרה במזרח, גובהו עשרים אמה ורחבו עשר, ושני פשפשים לו. דלתותיו של נחושת קלינית שהבהיקה כזהב; כשהביאן ניקנור באניה מאלכסנדריא שקט הים מזעפו, ולכן לא החליפום בזהב.', yi: 'דער מזרח-טויער פון דער עזרה, צוואנציג הויך און צען ברייט, מיט צוויי פשפשים. זיינע טירן זענען געווען פון קארינטישן קופער וואס האט געשיינט ווי גאלד; ווען ניקנור האט זיי געברענגט מיט א שיף פון אלעקסאנדריע האט זיך דער ים געשטילט, דערפאר האט מען זיי קיינמאל נישט געביטן אויף גאלד.', es: 'La puerta oriental del atrio, de veinte de alto y diez de ancho, con dos postigos. Sus puertas eran de bronce corintio que brillaba como oro; cuando Nicanor las trajo por mar desde Alejandría, el mar se calmó, y nunca se cambiaron por oro.' }),
  P('maalot', [44, 59, -15, 15], { L: 15, H: 7.5 }, 'Middot 2:5 · Sukkah 51b', [62, 0],
    { en: 'The Fifteen Steps', he: 'חמש עשרה המעלות', yi: 'די פופצן טרעפ', es: 'Los quince escalones' },
    { en: 'Fifteen semicircular steps — “round like half a threshing floor” — each half an amah, rising 7½ amos from Ezras Nashim to Sha’ar Nikanor, corresponding to the fifteen Shir HaMa’alos the Leviim sang upon them.', he: 'חמש עשרה מעלות עגולות ״כחצי גורן עגולה״, כל אחת חצי אמה, העולות שבע אמות ומחצה מעזרת נשים לשער ניקנור, כנגד חמש עשרה שירי המעלות שהלויים אמרו עליהן.', yi: 'פופצן האלב-רונדע טרעפ — ״כחצי גורן עגולה״ — יעדע א האלבע אמה, וואס גייען ארויף זיבן און א האלב אמות פון עזרת נשים צום שער ניקנור, אקעגן די פופצן שיר המעלות וואס די לוים האבן אויף זיי געזינגען.', es: 'Quince escalones semicirculares — “redondos como medio campo de trilla” — de medio codo, que suben 7½ codos del atrio de las mujeres a Nicanor, como los quince Cantos de las Subidas que cantaban los leviím.' }),
  P('nezirim', [139, 179, 27.5, 67.5], { L: 40, W: 40 }, 'Middot 2:5', [137, 20],
    { en: 'Lishkas HaNezirim (south-east)', he: 'לשכת הנזירים', yi: 'לשכת הנזירים', es: 'Cámara de los nazareos' },
    { en: 'The south-eastern chamber, open to the sky. Nezirim cooked their shelamim here, shaved their hair and threw it into the fire under the pot.', he: 'הלשכה הדרומית-מזרחית, שאינה מקורה. שם הנזירים מבשלים את שלמיהם ומגלחים את שערם ומשליכים אותו תחת הדוד.', yi: 'די דרום-מזרח לשכה, אפן צום הימל. דארט האבן די נזירים געקאכט זייערע שלמים, זיך אפגעשוירן און די האר אריינגעווארפן אונטער׳ן טאפ.', es: 'La cámara sureste, sin techo. Los nazareos cocían aquí sus ofrendas de paz, se rapaban y echaban el pelo al fuego bajo la olla.' }),
  P('etzim', [139, 179, -67.5, -27.5], { L: 40, W: 40 }, 'Middot 2:5', [137, -20],
    { en: 'Lishkas HaEtzim (north-east)', he: 'לשכת העצים', yi: 'לשכת העצים', es: 'Cámara de la leña' },
    { en: 'The north-eastern chamber, for the wood. Kohanim with blemishes, who could not serve at the altar, checked every log for worms; wormy wood was unfit for the Mizbeach.', he: 'הלשכה הצפונית-מזרחית, לעצים. כהנים בעלי מומין מתליעים בה את העצים; עץ שנמצאה בו תולעת פסול למזבח.', yi: 'די צפון-מזרח לשכה, פאר האלץ. כהנים בעלי מומין האבן דארט באקוקט יעדן האלץ אויף ווערעם; האלץ מיט א ווארעם איז פסול פארן מזבח.', es: 'La cámara noreste, para la leña. Cohanim con defectos revisaban cada leño buscando gusanos; la madera agusanada no servía para el altar.' }),
  P('metzoraim', [44, 84, -67.5, -27.5], { L: 40, W: 40 }, 'Middot 2:5 · Negaim 14:8', [86, -20],
    { en: 'Lishkas HaMetzora’im (north-west)', he: 'לשכת המצורעים', yi: 'לשכת המצורעים', es: 'Cámara de los leprosos' },
    { en: 'The north-western chamber, where a metzora immersed on his eighth day before coming to the Nikanor gate for his purification.', he: 'הלשכה הצפונית-מערבית, ששם המצורע טובל ביום השמיני לפני שבא לשער ניקנור לטהרתו.', yi: 'די צפון-מערב לשכה, וואו א מצורע האט זיך געטובלט דעם אכטן טאג פאר ער איז געקומען צום שער ניקנור פאר זיין טהרה.', es: 'La cámara noroeste, donde el leproso se sumergía al octavo día antes de presentarse en la puerta de Nicanor.' }),
  P('shemanim', [44, 84, 27.5, 67.5], { L: 40, W: 40 }, 'Middot 2:5 (Abba Shaul)', [86, 20],
    { en: 'Lishkas Beis Shemanya (south-west)', he: 'לשכת בית שמניא', yi: 'לשכת בית שמניא', es: 'Cámara del aceite' },
    { en: 'The south-western chamber. R’ Eliezer ben Yaakov forgot its use; Abba Shaul said wine and oil for the menachos and nesachim were stored here.', he: 'הלשכה הדרומית-מערבית. ר׳ אליעזר בן יעקב שכח מה הייתה משמשת; אבא שאול אומר: שם היו נותנים יין ושמן.', yi: 'די דרום-מערב לשכה. ר׳ אליעזר בן יעקב האט פארגעסן צו וואס זי האט געדינט; אבא שאול זאגט: דארט האט מען געהאלטן וויין און אייל.', es: 'La cámara suroeste. Rabí Eliézer ben Yaakov olvidó su uso; Abá Shaúl dijo que allí se guardaban vino y aceite.' }),
  P('nashim', [44, 182, -67.5, 67.5], { L: 135, W: 135 }, 'Middot 2:5 · Sukkah 51b · Shekalim 6:5', [150, 0],
    { en: 'Ezras Nashim — the Women’s Court', he: 'עזרת נשים', yi: 'עזרת נשים', es: 'Atrio de las mujeres' },
    { en: '135 by 135 amos, open to men and women. Four unroofed chambers of 40 × 40 at the corners. Galleries were built around it for Simchas Beis HaSho’eivah. Along its walls stood thirteen shofar-shaped chests for the Temple funds; on Sukkos four golden menoros fifty amos tall lit all Yerushalayim.', he: 'מאה שלושים וחמש על מאה שלושים וחמש, פתוחה לאנשים ולנשים. ארבע לשכות שאינן מקורות, ארבעים על ארבעים, בפינותיה. בנו בה גזוזטראות לשמחת בית השואבה. לאורך כתליה שלושה עשר שופרות; ובסוכות ארבע מנורות זהב גבוהות חמישים אמה האירו את כל ירושלים.', yi: 'הונדערט פינף און דרייסיג אויף הונדערט פינף און דרייסיג אמות, אפן פאר מענער און פרויען. פיר לשכות אן א דאך, פערציג אויף פערציג, אין די ווינקלען. מען האט געבויט באלקאנען פאר שמחת בית השואבה. לענגאויס די ווענט זענען געשטאנען דרייצן שופרות פאר די הקדש-געלטער; סוכות האבן פיר גאלדענע מנורות, פופציג אמות הויך, באלויכטן גאנץ ירושלים.', es: '135 por 135 codos, abierto a hombres y mujeres. Cuatro cámaras sin techo de 40 × 40 en las esquinas. Se construyeron galerías para la alegría del pozo. Junto a sus muros, trece cofres en forma de shofar; en Sucot cuatro menorás de oro de cincuenta codos iluminaban toda Jerusalén.' }),
  P('cheil', [-165, 200, -86, 86], { W: 10 }, 'Middot 2:3 · Keilim 1:8', [192, 0],
    { en: 'The Cheil', he: 'החיל', yi: 'דער חיל', es: 'El Jeil' },
    { en: 'A band ten amos wide inside the Soreg, holier than the rest of Har HaBayis: nochrim and those tamei meis did not enter it. Twelve steps, each half an amah, led up from it to Ezras Nashim.', he: 'רצועה ברוחב עשר אמות לפנים מן הסורג, מקודשת מהר הבית: נכרים וטמאי מתים אינם נכנסים לשם. שתים עשרה מעלות של חצי אמה עולות ממנו לעזרת נשים.', yi: 'א סטריפע צען אמות ברייט אינעווייניג פונעם סורג, הייליגער ווי דער רעשט פונעם הר הבית: נכרים און טמאי מתים גייען דארט נישט אריין. צוועלף טרעפ פון א האלבע אמה גייען ארויף פון דארט צו עזרת נשים.', es: 'Una franja de diez codos dentro del Soreg, más santa que el resto del Monte: no entraban gentiles ni impuros por muerto. Doce escalones de medio codo subían de allí al atrio de las mujeres.' }),
  P('stoa', [-246, 246, 210, 246], { L: 492, W: 34 }, 'Josephus, Antiquities 15.11.5 · Avi-Yonah model', [0, 205],
    { en: 'The Royal Stoa (south)', he: 'הסטיו המלכותי', yi: 'דער קעניגליכער סטיו', es: 'El Pórtico Real' },

function drawPlan(g, w, h, view, opts = {}) {
  const [x0, x1, z0, z1] = view; const sc = Math.min(w / (x1 - x0), h / (z1 - z0)); const ox = (w - (x1 - x0) * sc) / 2, oz = (h - (z1 - z0) * sc) / 2;

/* ---------- HUD ---------- */
let currentPlace, hudT = 0;
function updateHUD(dt) {
  hudT -= dt; if (hudT > 0) return; hudT = 0.25;
  const p = placeAt(player.x, player.z);
  if (p !== currentPlace) { currentPlace = p; $('locHe').textContent = p ? p.name.he : 'ירושלים'; $('locEn').textContent = p ? (LANG === 'he' ? '' : L(p.name)) : (LANG === 'he' ? '' : T('jerusalem')); }

/* ---------- main loop: frame cap + adaptive resolution ---------- */
const clock = new THREE.Clock();
let lpT = 0, perfT = 0, perfFrames = 0, lastFrame = 0;
function frame(now) {
  if (now - lastFrame < 1000 / 62) return;               // never render faster than ~60 fps (saves power on 120/144 Hz screens)
  lastFrame = now;
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  updatePlayer(dt);
  updateNPCs(dt, state === 'play' ? player : camera.position);

}
